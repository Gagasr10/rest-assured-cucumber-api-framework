name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual run with custom env/tags
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "dev"
      tags:
        description: "Cucumber tags to run"
        required: true
        default: "@orders"

# Prevent parallel runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ "${{ inputs.env || 'dev' }}" ]
        tags: [ "${{ inputs.tags || '@orders' }}" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        env:
          MAVEN_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          mvn -B clean test \
            -Denv=${{ matrix.env }} \
            -Dcucumber.filter.tags="${{ matrix.tags }}"

      # Upload Cucumber HTML + JSON report
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.env }}-${{ matrix.tags }}
          path: target/cucumber-report

      # Upload TestNG Surefire reports
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.env }}-${{ matrix.tags }}
          path: target/surefire-reports

      # Upload raw Allure results (for local viewing)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.env }}-${{ matrix.tags }}
          path: target/allure-results
